- title: Research Experience
  type: time_table
  contents:
    - title: Nonlinear Dynamics and Data-Driven Optimization of Electromechanical Energy Harvesters
      institution: Rensselaer Polytechnic Institute
      year: Jan. 2024 - Dec. 2026
      description:
        - Analyze coupled nonlinear systems using energy conversion principles, stability, modal analysis, mixing entropy, and Lagrangian, Hamiltonian, and Newtonian mechanics.
        - Develop interpretable hybrid models using SINDy, neural ordinary differential equations, and universal differential equations.
        - Apply scientific machine learning and numerical optimization to identify missing physics and improve energy-harvester designs.
    - title: IBM Thin Films Fabrication Research
      institution: Rensselaer Polytechnic Institute
      year: May 2024 - Dec. 2025
      description:
        - Fabricated semiconductor thin-film test structures using photolithography, thickness metrology, e-beam evaporation, and liftoff.
        - Used the 3-omega electrothermal method to characterize in-plane and cross-plane thermal transport.
        - Developed automated analysis tools for thermal-property extraction and material-performance studies.
    - title: Electrostatic MEMS Energy Harvesting for Sensing Power
      institution: Rensselaer Polytechnic Institute
      year: Jan. 2020 - May 2023
      description:
        - Developed analytical models of viscous damping, electrostatic coupling, and collision dynamics for impact-based MEMS frequency up-converters.
        - Applied Gaussian-process Bayesian optimization and Latin hypercube sampling to improve output voltage and identify geometric design trends.
        - Fabricated and experimentally characterized devices in a cleanroom environment.

