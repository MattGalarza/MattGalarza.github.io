- title: Work Experience
  type: time_table
  contents:
    - title: Mechatronics and Robotics Fellow
      institution: GE Aerospace Research
      image: cv/GE.svg
      image_alt: GE Aerospace
      year: Aug. - Dec. 2025
      maindescription: Developed biologically inspired, robotics-enabled inspection and metrology tools for jet-engine damage detection and dimensional verification, reducing representative inspection workflows from approximately 50 hours to approximately 2 hours without engine teardown.
      description:
        - Led concept-to-prototype development of Linipot-on-Demand, an in-situ probe for measuring stator and core cold-clearance distortion in assembled engines.
        - Designed compliant, soft-robotics-inspired mechanical interfaces and an insertion protocol for tight borescope-port constraints.
        - Engineered anchoring and stabilization strategies for repeatable measurements during probe rotation under engine-geometry and articulation constraints.
        - Advanced camera-assisted confirmation workflows for identifying rubs, scabs, and other defects without teardown and reassembly.
        - Processed, cleaned, aligned, and interpreted multi-scanner point-cloud datasets and produced comparative trade studies supporting scanner selection and procurement.
        - Authored a standard operating procedure, user manual, assembly manual, and bill of materials; supported a live demonstration on an operational engine for senior GE leadership.
        - Contributed to two patent applications and invention disclosures related to the inspection approaches.
    - title: Robotics Engineering Intern
      institution: Collaborative Robotics
      image: cv/collaborative-robotics.svg
      image_alt: Collaborative Robotics
      year: May - Dec. 2023
      maindescription: Supported the launch of the company's inaugural pilot robot and the development of robotic systems for perception and autonomy.
      description:
        - Led the mechanical design, manufacturing, prototyping, and deployment of a complete robotic subsystem aligned with the industrial-design intent.
        - Coordinated design-for-manufacturing and design-for-assembly feedback with external manufacturers and streamlined part procurement.
        - Engineered and implemented test rigs that supported the transition from simulation to reliable real-world operation.
        - Designed printed circuit boards in Altium and supported hardware bring-up.
    - title: Mechanical/Process Engineering Intern
      institution: Tesla Motors
      image: cv/tesla.svg
      image_alt: Tesla
      year: May - Aug. 2021
      description:
        - Designed and evaluated pressure-relief systems, including relief valves and pressure-vacuum relief valves, based on operating limits and potential failure conditions.
        - Performed cryogenic-tank heat-loss analysis that identified delivery vulnerabilities and helped prevent approximately $45,000 per month in potential production downtime.
        - Managed manufacturing and vendor relationships to obtain quotations, validate designs, and facilitate device production.
    - title: Project Management Engineering Intern
      institution: Sanofi Pasteur
      image: cv/sanofi1.png
      image_alt: Sanofi
      year: Jan. - Aug. 2020
      maindescription: Supported GMP and non-GMP engineering projects for vaccine manufacturing, maintenance, and facilities within the Technical Services-Site Engineering department.
      description:
        - Performed field verification and CAD revision of more than 100 engineering drawings, including water, formulation, equipment, autoclave, compressed-air, and piping and instrumentation drawings.
        - Supported a project diverting 5,122 tons of egg waste and 9,050 industrial plastic totes from landfills annually through mechanical design, field testing, troubleshooting, and data collection.
