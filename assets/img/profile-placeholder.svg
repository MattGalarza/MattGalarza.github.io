<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Professional headshot placeholder</title>
  <desc id="desc">A neutral portrait silhouette marking where a professional headshot should be added.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26262b" />
      <stop offset="1" stop-color="#111114" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8" />
      <stop offset="1" stop-color="#d100b7" />
    </linearGradient>
  </defs>
  <rect width="720" height="720" fill="url(#background)" />
  <circle cx="595" cy="125" r="160" fill="#d100b7" opacity="0.2" />
  <circle cx="120" cy="620" r="210" fill="#6954d9" opacity="0.18" />
  <circle cx="360" cy="274" r="118" fill="#d7d7dc" />
  <path d="M138 674c15-167 99-257 222-257s207 90 222 257" fill="#d7d7dc" />
  <rect x="194" y="628" width="332" height="7" rx="3.5" fill="url(#accent)" />
  <text x="360" y="684" fill="#f7f7f8" font-family="Arial, sans-serif" font-size="25" letter-spacing="5" text-anchor="middle">
    HEADSHOT PLACEHOLDER
  </text>
</svg>
